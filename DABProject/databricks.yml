# This is a Declarative Automation Bundle definition for DABProject.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: DABProject
  uuid: 2b1bfcf0-3cd6-4489-9e90-603b68589b73

include:
  - resources/*.yml
  - resources/*/*.yml

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-5367e017-19d5.cloud.databricks.com/sql
    presets:
      name_prefix: dev_${workspace.current_user.short_name}
      source_linked_deployment: false

  prod:
    mode: production
    workspace:
      host: https://dbc-5367e017-19d5.cloud.databricks.com/sql
      # We explicitly deploy to /Workspace/Users/hariprasadkulkarni2130@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/hariprasadkulkarni2130@gmail.com/PROD/.bundle/${bundle.name}/${bundle.target}

    permissions:
      - user_name: hariprasadkulkarni2130@gmail.com
        level: CAN_MANAGE
